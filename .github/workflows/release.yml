name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check tag
        run: if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag '$env:TAG' is not of the form v1.2.3." }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Publish
        run: >
          dotnet publish src/JagexManager -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          "-p:Version=$($env:TAG.Substring(1))" -o publish
      - name: Checksum
        run: (Get-FileHash publish/JagexManager.exe -Algorithm SHA256).Hash + "  JagexManager.exe" | Out-File publish/JagexManager.exe.sha256 -Encoding ascii
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:TAG publish/JagexManager.exe publish/JagexManager.exe.sha256 "src/JagexManager/Fonts/Cinzel-OFL.txt#Cinzel font licence (OFL)" "src/JagexManager/Fonts/Inter-OFL.txt#Inter font licence (OFL)" --draft --generate-notes
